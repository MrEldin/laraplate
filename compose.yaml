name: laraplate

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laraplate}
      DB_USERNAME: ${DB_USERNAME:-laraplate}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laraplate}
      POSTGRES_USER: ${DB_USERNAME:-laraplate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laraplate} -d ${DB_DATABASE:-laraplate}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs Laravel's scheduler, which is what makes Schedule::command(...) in
  # routes/console.php actually fire. Without it, scheduled agents never run.
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laraplate}
      DB_USERNAME: ${DB_USERNAME:-laraplate}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy

  # Processes queued work, including ->queue() agent prompts.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --backoff=10
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: worker
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laraplate}
      DB_USERNAME: ${DB_USERNAME:-laraplate}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
